name: CI and Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/release.py check-title --title "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  checks:
    name: Game tests and release plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_version: ${{ steps.release.outputs.build_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/godot-release
          key: godot-tests-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release-config.json', 'tools/install_godot.py', 'tools/platforms.py') }}
      - run: python tools/install_godot.py --editor-only
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/check.py
      - name: Plan release for every merge
        id: release
        run: python tools/release.py plan --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: release-plan
          path: build/release-notes.md
          retention-days: 1
          if-no-files-found: error

  package:
    name: Package ${{ matrix.group }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: linux-x86_64
            runner: ubuntu-24.04
          - group: linux-arm64
            runner: ubuntu-24.04-arm
          - group: windows-x86_64
            runner: windows-2025
          - group: windows-arm64
            runner: windows-11-arm
          - group: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/godot-release
            ~/.cache/generala-appimage
          key: godot-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release-config.json', 'tools/install_godot.py', 'tools/platforms.py') }}
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm desktop-file-utils
      - name: Install pinned editor and templates
        run: python tools/install_godot.py --group '${{ matrix.group }}'
      - name: Native game integration
        run: python tools/check.py
      - name: Install browser for WebAssembly test
        if: matrix.group == 'linux-x86_64'
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Export, package and test native executables
        env:
          RELEASE_VERSION: ${{ needs.checks.outputs.build_version }}
        run: python tools/build_release.py --version "$RELEASE_VERSION" --group '${{ matrix.group }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: release-${{ matrix.group }}
          path: build/releases/*
          retention-days: 1
          compression-level: 9
          if-no-files-found: error

  verify:
    name: Verify and package
    if: always()
    needs: [checks, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all platform checks
        env:
          TESTS: ${{ needs.checks.result }}
          PACKAGES: ${{ needs.package.result }}
        run: test "$TESTS" = success && test "$PACKAGES" = success

  release:
    name: Publish release
    timeout-minutes: 20
    needs: [checks, package, verify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: build/releases
      - name: Verify manifests and publish all packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: python3 tools/publish_release.py --version "$VERSION"
      - name: Remove temporary workflow artifacts after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].id' |
          while read -r artifact_id; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done
